# Duration study (protocol frozen 2026-11-03): horizons 43/86/172 = 2/1/0.5 min per update x 86 min (DSWD); 100 = equality check vs the 100-step run.
# Second fire (Sitio Airbase / Sanggi Interior, Pajo, 2025-01-24 13:00 LST): copy of windfix_B_nasa_t040_s45.yaml with only ignition (Kent 606063.9,1140379.2 moved 1 cell S onto a building), wind, output_dir changed (2026-11-02)
environment:
  raster_dir: processedData/raster/raster
  slope_file: stack_slope_final.tif
  proximity_file: stack_proximity.tif
  buildings_file: stack_buildings.tif
  materials_file: stack_materials.tif
  nodata_value: -9999
simulation:
  max_timesteps: 172
  snapshot_steps: [43, 86, 100, 172]
  seed: 45
  ignition_points:
  - - 606063.2784
    - 1140377.2699
  early_stop: true
wind:
  speed_kmh: 10.6
  direction_deg: 61.0
flammability_weights:
  base_weight: 0.5
  slope_weight: 0.3
  proximity_weight: 0.2
placeholder_transition:
  base_ignition_prob: 0.12
  slope_weight: 0.2
  building_weight: 0.1
  proximity_weight: 0.2
  wind_weight: 0.2
  burnout_prob: 0.04
  material_weight: 0.35
ml_model:
  enabled: true
  model_path: models/fire_lr_windweighted_windfix.joblib
  proba_threshold: 0.4
output:
  output_dir: output/windfix/duration/airbase_B_t040_s45
  save_every_n_steps: 10
  save_final_state: true
dataset_generation:
  roi:
    row_start: 1800
    row_end: 2600
    col_start: 2400
    col_end: 3200
  n_ignition_points: 5
  timesteps_to_record: 40
  output_csv: dataFiles/synthetic_fire_dataset.csv
